name: Validate and republish v0.2.4 F8 fix

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/republish-v0.2.4-f8-fix.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Meraki-MSP-Toolkit.py

      - name: Validate Video 10 handlers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "def _video10_branch1_preview_hotkey" Meraki-MSP-Toolkit.py
          grep -q "def _video10_branch1_wait_for_networks" Meraki-MSP-Toolkit.py
          grep -q "def _video10_branch1_fill_and_preview" Meraki-MSP-Toolkit.py
          grep -q "Video 10 build" Meraki-MSP-Toolkit.py

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Meraki-MSP-Toolkit-v0.2.4.zip"
          rm -f "$ZIP"
          zip -r "$ZIP" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x "*.zip"
          sha256sum "$ZIP" | tee /tmp/v0.2.4.sha256

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(awk '{print $1}' /tmp/v0.2.4.sha256)"
          {
            echo "# Meraki MSP Toolkit v0.2.4"
            echo
            echo "Latest public release of Meraki MSP Toolkit."
            echo
            echo "## v0.2.4 - Video 10 presenter controls"
            echo
            echo "- F8 loads and previews DiCerbo Demo - Branch 1 in Zodiac technology."
            echo "- F9 opens the normal guarded CREATE confirmation only after a valid preview."
            echo "- Fixed startup crash from missing presenter hotkey handlers."
            echo "- Fixed an asynchronous organization-refresh race that could invalidate the F8 preview before F9."
            echo "- Updated the header to Video 10 build."
            echo "- Improved the Windows launcher so startup failures remain visible."
            echo
            echo "## Download"
            echo
            echo "Download Meraki-MSP-Toolkit-v0.2.4.zip from Assets below."
            echo
            echo "SHA-256:"
            echo
            echo "\`$SHA\`"
          } > /tmp/release-notes.md

      - name: Replace v0.2.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v0.2.4 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

          gh release create v0.2.4 \
            Meraki-MSP-Toolkit-v0.2.4.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "4665b5dc8fe1fbec52d619f35e9af560e58b5d23" \
            --title "Meraki MSP Toolkit v0.2.4" \
            --notes-file /tmp/release-notes.md \
            --latest
